[tools]
bun = "1.3.11"
node = "24"

[tasks.install]
description = "Install client dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Run the client dev server, proxying /api to the API on :4000"
run = "bun run dev"

[tasks.build]
description = "Build the static client into build/"
run = "bun run build"

[tasks.android]
description = "Build the client and sync it into the Android project"
run = "bun run build && npx cap sync android"

[tasks.android-open]
description = "Open the Android project in Android Studio"
run = "npx cap open android"
