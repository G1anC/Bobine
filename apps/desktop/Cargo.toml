[package]
name = "bobine-desktop"
version = "0.1.0"
description = "Bobine desktop app: a Tauri shell around the web client"
license = "MIT"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "bobine-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
